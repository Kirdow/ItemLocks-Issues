name: Feature Request
description: Suggest an idea for ItemLocks.
title: '[Feature Request]: '
labels:
  - enhancement
body:
  - type: input
    id: '1'
    attributes:
      label: Short description of feature idea?
      description: The description should be one or two sentences at most.
    validations:
      required: true
  - type: textarea
    id: '2'
    attributes:
      label: Problem Description
      description: >-
        Please add a clear and concise description of the problem you are
        seeking to solve with this feature request.
    validations:
      required: true
  - type: textarea
    id: '3'
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like in a clear and concise manner.
    validations:
      required: true
  - type: checkboxes
    id: '4'
    attributes:
      label: Has your feature been requested before?
      description: By submitting this issue, you verify that you've read the [FAQ](https://itemlocks.com/faq/) as well as having checked existing open issues to make sure your issue has not been reported in the past.
      options:
        - label: I verify that this issue is for a topic that has not yet been submitted.
          required: true
